name: BreathApp
options:
  bundleIdPrefix: com.chuyumin
  deploymentTarget:
    iOS: "16.0"
targets:
  BreathApp:
    type: application
    platform: iOS
    sources:
      - path: BreathApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chuyumin.BreathApp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "호흡"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ENABLE_PREVIEWS: YES
